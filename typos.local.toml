# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Official names: the Astroid library and GitHub Flavored Markdown.
accepted = ["artifact", "Astroid", "Flavored"]

[words.corrections]

[patterns]
# `act` exposes this literal command-line flag with US spelling.
# The vendored uv_gate.py lists uv's short flags (-U, -P, -n) as the string
# "UPn"; the file is byte-for-byte canonical, so exempt that one line.
ignore = ["--artifact-server-path", '(?m)^FORBIDDEN_SHORT = "UPn"$']

[files]
exclude = []

name: Coverage (main)

# The one CodeScene publisher. Main owns the ratchet baseline and
# CodeScene publication; pull requests read this baseline but neither
# receive CodeScene credentials nor contact CodeScene. ci.yml's
# generate-coverage selection has to match the one below field for
# field, and tests/workflow_contracts holds that shape.
#
# workflow_dispatch lets the upload be re-run on demand: merges
# performed by the automerge workflow's GITHUB_TOKEN do not fire
# push-event workflows, so automerged changes to main only get
# coverage via a manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One publisher generation per ref at a time, never cancelled. GitHub
# keeps at most one pending run per group, so a newer push replaces an
# older pending run and the newest baseline wins; a cancelled run would
# abandon both its upload and its baseline write. The group carries the
# ref so that a dispatch from a branch cannot replace a pending push to
# main and leave that merge unpublished.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          python-source: ./hecate
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: hecate-main
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        # The ref as well as the token: a dispatch can name any branch, and
        # without this guard it would upload that branch's coverage as
        # main's.
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}

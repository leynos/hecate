name: Coverage (main)

# The one CodeScene publisher. Main owns the ratchet baseline and
# CodeScene publication; pull requests read this baseline but neither
# receive CodeScene credentials nor contact CodeScene. ci.yml's
# generate-coverage selection has to match the one below field for
# field, and `make test-workflow-contracts` holds that shape.
#
# workflow_dispatch lets the upload be re-run on demand: merges
# performed by the automerge workflow's GITHUB_TOKEN do not fire
# push-event workflows, so automerged changes to main only get
# coverage via a manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One group per ref, never cancelled. Runs for main never overlap, and
# GitHub keeps at most one pending run per group, so a newer trigger
# replaces an older pending run rather than queueing behind it. The group
# is keyed on the ref alone, so a branch dispatch cannot replace a pending
# push to main. GitHub does not promise to start runs in trigger order, so
# this is not a guarantee of commit order: an older run can still publish
# last, and its coverage and baseline then stand until a later successful
# run supersedes them, which is accepted. A manual re-run of an older run
# keeps its SHA and its run id: it republishes that commit's coverage to
# CodeScene, but its baseline cache key already exists, so it replaces no
# baseline unless the original run saved none. A dispatch saves no
# baseline, so one that replaces pending pushes leaves the ratchet
# baseline behind until the next push, which is accepted.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    env:
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          language: python
          python-source: ./hecate
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: hecate-main
          pytest-workers: ''
          with-ratchet: 'true'

      # Whether the token exists, learnt without binding it: the expression
      # is evaluated before the shell runs, so no step holds the secret.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        # The ref as well as the token: a dispatch can name any branch, and
        # without this guard it would upload that branch's coverage as main's.
        # The token goes in only as the input: the uploader is a composite
        # action, and a step `env` would reach every action nested in it.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

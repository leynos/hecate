name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
      # Keep this pin in sync with NOSE_VERSION in the Makefile and the
      # `version` in [tool.nose]; tests/toolchain_contract/ enforces the
      # match.
      NOSE_VERSION: '0.20.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      
      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil
      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done

      # The Makefile scopes uv to repo-local cache and tool directories, so
      # caching them preserves the Skylos tool environment, the duplication
      # gate's script environment, and the pinned Pylint tool environment
      # between runs. The Makefile and gate scripts pin those tool versions,
      # so their hashes key the cache alongside the project lockfile.
      - name: Cache uv tool and script environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .uv-cache
            .uv-tools
          key: uv-envs-${{ runner.os }}-${{ hashFiles('uv.lock', 'Makefile', 'scripts/*.py') }}
          restore-keys: |
            uv-envs-${{ runner.os }}-

      # cargo-binstall clones the nose repository before it downloads the
      # release artefact, so cache the installed binary and skip the whole
      # install on a hit. The key carries the pinned version, so a bump
      # misses the cache and reinstalls.
      - name: Cache the pinned nose duplication detector
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/nose
          key: nose-${{ runner.os }}-${{ env.NOSE_VERSION }}

      - name: Install nose duplication detector
        env:
          BINSTALL_VERSION: 'v1.22.0'
          BINSTALL_SHA256: 'df2921254924066627685ee09f6c8b9acd7acef68a338668f879d2b033c09458'
        run: |
          if [ "$(.tools/nose/nose --version 2>/dev/null)" = "nose ${NOSE_VERSION}" ]; then
            echo "nose ${NOSE_VERSION} restored from cache"
            exit 0
          fi
          binstall_archive="$(mktemp)"
          binstall_directory="$(mktemp -d)"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$binstall_archive" \
            "https://github.com/cargo-bins/cargo-binstall/releases/download/${BINSTALL_VERSION}/cargo-binstall-x86_64-unknown-linux-musl.tgz"
          echo "${BINSTALL_SHA256}  ${binstall_archive}" | sha256sum -c -
          tar -xzf "$binstall_archive" -C "$binstall_directory"
          mkdir -p .tools/nose
          "$binstall_directory/cargo-binstall" --no-confirm \
            --disable-strategies compile,quick-install \
            --install-path .tools/nose \
            --git https://github.com/corca-ai/nose "nose-cli@${NOSE_VERSION}"
          .tools/nose/nose --version

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git --include-untracked`;
        # this pins the version the estate formats with.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Run lint gate, including Skylos dead-code detection
        run: make lint

      # The gate helper tests need the pinned helper dependencies in an
      # isolated interpreter, which `make test` does not build. Run them
      # here so a defect in the gate itself fails CI on the pull request.
      - name: Run duplication gate helper tests
        run: make duplication-test

      - name: Run typechecker
        run: make typecheck

      # Guarded to pull requests: pushes to main run the suite and
      # upload coverage in coverage-main.yml, so running this step on
      # main too would duplicate the suite and race the ratchet
      # baseline save (see wireframe#589). The ratchet compares against
      # the baseline main writes; nothing here talks to CodeScene, and
      # publish-artefact is off because the report is compared, not
      # published.
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@8e6a325765ba382691d1b1c65fcccf1fc1d1b00c
        with:
          language: python
          python-source: ./hecate
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: hecate
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'

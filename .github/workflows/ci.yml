name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      
      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Check spelling
        run: make spelling

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Guarded to pull requests: pushes to main run the suite and
      # upload coverage in coverage-main.yml, so running this step on
      # main too would duplicate the suite and race the ratchet
      # baseline save (see wireframe#589).
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@927edd45ae77be4251a8a18ca9eb5613a2e32cbd
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: hecate
          with-ratchet: 'true'

      # The `mode: check` step is deliberately not wired in yet: CodeScene
      # project 80198 has no coverage-gates configuration, so
      # `cs-coverage check` would fail every run with "HTTP call
      # succeeded, but the received project-config isn't valid. Lacks
      # the gates configuration." — a CodeScene-side per-project
      # setting, not a CI defect (see ddlint#287 and chutoro#156 for the
      # byte-identical error). Add the check step in a fast-follow PR
      # once coverage-main.yml has uploaded to main at least once and
      # the gate is confirmed to resolve, or once CodeScene confirms
      # the project's coverage gate is enabled.

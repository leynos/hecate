name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Check spelling
        run: make spelling

      - name: Run lint gate, including Skylos dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Guarded to pull requests: pushes to main run the suite and
      # upload coverage in coverage-main.yml, so running this step on
      # main too would duplicate the suite and race the ratchet
      # baseline save (see wireframe#589). The ratchet compares against
      # the baseline main writes; nothing here talks to CodeScene, and
      # publish-artefact is off because the report is compared, not
      # published.
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@3822201c597078a5ed1939bdf067fe06a3d78a9d
        with:
          language: python
          python-source: ./hecate
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: hecate
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'

---
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  # Queue rather than cancel. A re-pushed tag that cancelled the running
  # release could stop it part-way through an upload. The queued run then
  # starts from a complete state, and the reconciliation below makes it safe to
  # repeat.
  cancel-in-progress: false

# Every job declares exactly what it needs, so nothing inherits a write scope.
permissions: {}

# Each filename's canonical bytes are the ones already published: PyPI's
# first, then an existing asset on the tag's GitHub Release, and this run's
# attested file only when neither has the name. Each destination receives only
# the names it lacks, never overwriting, and `publish-release` checks both hold
# the same digests before the release becomes visible. A published release can
# no longer receive a name, so `publish-pypi` refuses one before uploading it.
# The decisions live in
# `scripts/release_assets.py`; network calls stay in these steps. YAML anchors
# (`&name`, `*name`) share the steps several jobs repeat verbatim.
jobs:
  # Runs beside the build rather than before it, so the build lane never
  # queues behind a hosted job; every job that attests, uploads, or releases
  # waits on it instead.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.pyproject-version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The tag carries the `v` the declared version does not; what remains is
      # compared with the manifest as a string, so `v0.2.0b1` matches
      # `0.2.0b1` and any other spelling fails.
      - name: Check the pyproject.toml version against the tag
        id: pyproject-version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export TAG_VERSION="${TAG#v}"
          python3 scripts/release_version.py

  # The sdist is built first and the wheel from it, so every release proves
  # the sdist is complete. `attest` refuses a run that produced anything other
  # than exactly one sdist, and `ci.yml` runs the same check on every pull
  # request.
  build-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # A local action must already be on disk to be resolved, so the
      # composite's own checkout cannot be the first one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.14'
          artifact-name: wheels-pure

  # Attests exactly the files this run built, before anything leaves the run,
  # and hands them on as one artefact. Bytes a later job carries over from an
  # earlier run were attested by that run, and every run's attestation stays
  # in the repository's attestation store. The bundle is named after the tag
  # alone: a re-run then finds the release already holds that name and uploads
  # nothing, while a name that changed per run would add a new asset each time.
  attest:
    needs:
      - check-version
      - build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - &scripts-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
      - name: Collect release artefacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist/publish
          find dist -path dist/publish -prune -o -type f \
            \( -name "*.whl" -o -name "*.tar.gz" \) -print0 | \
            xargs -0 -r -I {} cp {} dist/publish/
          unexpected=$(find dist -path dist/publish -prune -o -type f \
            ! -name "*.whl" ! -name "*.tar.gz" -print)
          if [ -n "${unexpected}" ]; then
            echo "Unexpected files in the release artefact:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          shopt -s nullglob
          wheels=(dist/publish/*.whl)
          sdists=(dist/publish/*.tar.gz)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "Expected at least one wheel." >&2
            ls -al dist/publish >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one source distribution." >&2
            ls -al dist/publish >&2
            exit 1
          fi
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/publish/*
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p dist/attestations
          cp "${BUNDLE_PATH}" "dist/attestations/hecate-enforce-${GITHUB_REF_NAME}.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        id: handoff
        with:
          name: release-dist
          path: |
            dist/publish
            dist/attestations
          if-no-files-found: error

  # Creates or reuses the draft and snapshots its assets, so the PyPI job can
  # carry GitHub's bytes over without a GitHub token of its own. A draft is
  # visible only to a token that can write contents.
  draft-release:
    needs:
      - check-version
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - *scripts-checkout
      - &release-dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create or reuse the draft release
        id: create
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run reuses whatever release the tag already has, draft or not.
          # A missing release is the expected first-run answer, so only a
          # different failure is printed and stops the job; an access or
          # network error must not be mistaken for "no release yet".
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2> release-view.err; then
            echo "Reusing the existing release for ${GITHUB_REF_NAME}."
            exit 0
          fi
          if ! grep -qi 'not found' release-view.err; then
            echo "Could not read the release for ${GITHUB_REF_NAME}:" >&2
            cat release-view.err >&2
            exit 1
          fi
          flags=(--draft --verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [ "${IS_PRERELEASE}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}"
      - name: Snapshot the release assets
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p github-state/files
          # `isDraft` travels with the assets: a published release is immutable,
          # so `publish-pypi` must refuse a name it lacks before uploading.
          gh release view "${GITHUB_REF_NAME}" --json assets,isDraft \
            > github-state/assets.json
          python3 -m scripts.release_assets_cli carryover --publish dist/publish \
            --assets github-state/assets.json > github-state/carryover.txt
          while IFS= read -r name; do
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" \
              --dir github-state/files
          done < github-state/carryover.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        id: handoff
        with:
          name: release-github-state
          path: github-state
          if-no-files-found: error

  publish-pypi:
    needs:
      - attest
      - draft-release
    # Release orchestration: it uploads the artefacts other jobs built. No
    # build work, so it stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/hecate-enforce/
    permissions:
      contents: read
      id-token: write
    steps:
      - *scripts-checkout
      - *release-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-github-state
          path: github-state
      # `publish-release` reuses this script through its anchor. The runner's
      # curl cannot report `%{num_retries}`, so the loop retries a network
      # error, 429, or 5xx itself and counts the attempts. A caller that also
      # sets `EXPECTED_PUBLISH` keeps asking, within the same attempt budget,
      # until the index lists every artefact in that directory: PyPI's CDN can
      # answer 200 with a listing that predates an upload, and that miss is
      # invisible in the status alone.
      - name: Fetch the PyPI index
        id: index
        run: &fetch-index |
          set -euo pipefail
          # shellcheck source=scripts/release_report.sh
          . scripts/release_report.sh
          # `--poll` suppresses the error annotation, so only the retried
          # attempts pass it; the final gate below must annotate its failure.
          index_is_current() {
            python3 -m scripts.release_assets_cli index-expected "$@" \
              --publish "${EXPECTED_PUBLISH}" --index pypi-index.json
          }
          attempt=0
          status=000
          outcome=failed
          settled=false
          while [ "${attempt}" -lt 6 ] && [ "${settled}" = false ]; do
            attempt=$((attempt + 1))
            started=${SECONDS}
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 60 \
              --output pypi-index.json --write-out '%{http_code}' \
              --header 'Accept: application/vnd.pypi.simple.v1+json' \
              https://pypi.org/simple/hecate-enforce/) || status=000
            elapsed=$((SECONDS - started))
            outcome=retry
            case "${status}" in
              000|429|5??)
                if [ "${attempt}" -lt 6 ]; then
                  release_warn "PyPI simple index returned HTTP ${status} on attempt ${attempt}; retrying."
                  sleep 2
                else
                  settled=true
                fi
                ;;
              200|404)
                if [ -z "${EXPECTED_PUBLISH:-}" ] || index_is_current --poll; then
                  outcome=ok
                  settled=true
                elif [ "${attempt}" -lt 6 ]; then
                  release_warn "The PyPI index does not list every artefact yet (attempt ${attempt}); retrying."
                  sleep 5
                else
                  settled=true
                fi
                ;;
              *) settled=true ;;
            esac
            if [ "${outcome}" = retry ] && [ "${settled}" = true ]; then
              outcome=failed
            fi
            release_event fetch-index "${attempt}" "${status}" "${outcome}" "${elapsed}"
          done
          printf 'attempts=%s\nstatus=%s\n' "${attempt}" "${status}" >> "${GITHUB_OUTPUT}"
          release_log "PyPI simple index read: HTTP ${status} after ${attempt} attempt(s)."
          case "${status}" in
            200) ;;
            404) echo '{"files": []}' > pypi-index.json ;;
            *)
              release_warn "PyPI simple index returned HTTP ${status}."
              exit 1
              ;;
          esac
          if [ -n "${EXPECTED_PUBLISH:-}" ]; then
            index_is_current
          fi
      # PyPI rejects a second upload of an existing filename, so names it holds
      # are dropped, and a name only the GitHub Release holds is sent with
      # GitHub's bytes rather than this run's rebuild.
      - name: Skip artefacts already on PyPI
        id: pending
        run: |
          set -euo pipefail
          . scripts/release_report.sh
          release_run skip-pypi python3 -m scripts.release_assets_cli stage-pypi \
            --publish dist/publish --index pypi-index.json \
            --assets github-state/assets.json --github-files github-state/files
      # pypa's action rather than `uv publish`: with Trusted Publishing it also
      # signs and uploads a PEP 740 attestation for every file, which uv does
      # not. `skip-existing` takes the place of uv's `--check-url`, so a file
      # an interrupted earlier attempt already uploaded is skipped, not fatal.
      - name: Publish to PyPI
        id: upload
        if: steps.pending.outputs.remaining == 'true'
        uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b  # v1.14.3
        with:
          packages-dir: dist/publish/
          skip-existing: true

  # Runs only once PyPI holds every artefact, so the release's missing assets
  # take PyPI's bytes, and the release stays a draft unless both destinations
  # then agree.
  publish-release:
    needs:
      - check-version
      - draft-release
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - *scripts-checkout
      - *release-dist
      # Recorded once, before any staging: the upload decision below compares
      # this against PyPI's post-upload state.
      - name: Note whether the release is a draft
        id: draft
        run: |
          set -euo pipefail
          . scripts/release_report.sh
          release_run draft-state gh release view "${GITHUB_REF_NAME}" \
            --json isDraft --jq '.isDraft' > is-draft
          if [ "$(cat is-draft)" != true ]; then
            release_warn "The release is already published; nothing will be uploaded."
            echo "is-draft=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "is-draft=true" >> "${GITHUB_OUTPUT}"
      # This read decides what the release stages, so it must not act on a
      # listing that predates `publish-pypi`'s upload: a name the stale copy
      # omits would look absent from PyPI, and the run's rebuild would be
      # copied into the release. GitHub never overwrites an asset, so that
      # mistake would need a manual deletion. Poll until every name appears.
      - name: Fetch the PyPI index
        id: index
        env:
          EXPECTED_PUBLISH: dist/publish
        run: *fetch-index
      - name: List the release assets
        id: assets
        run: |
          set -euo pipefail
          . scripts/release_report.sh
          release_run list-assets gh release view "${GITHUB_REF_NAME}" \
            --json assets > release-assets.json
      - name: Stage the assets the release lacks
        id: stage
        run: |
          set -euo pipefail
          . scripts/release_report.sh
          release_run stage-assets python3 -m scripts.release_assets_cli stage-github \
            --publish dist/publish --index pypi-index.json \
            --assets release-assets.json --bundles dist/attestations \
            --output github-upload > pypi-fetch.tsv
          started=${SECONDS}
          outcome=ok
          while IFS=$'\t' read -r name url; do
            if ! curl --silent --show-error --location --fail \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 300 \
              --output "github-upload/${name}" "${url}"; then
              outcome=failed
              break
            fi
          done < pypi-fetch.tsv
          release_record fetch-pypi "${outcome}" 200 "$((SECONDS - started))"
          test "${outcome}" = ok
      - name: Check the fetched PyPI bytes
        id: fetched
        run: |
          set -euo pipefail
          . scripts/release_report.sh
          release_run check-fetched python3 -m scripts.release_assets_cli check-fetched \
            --publish dist/publish --index pypi-index.json \
            --assets release-assets.json --output github-upload
      # No `--clobber`: an asset the release already holds is canonical. A
      # published release is complete, so a re-run -- which always stages the
      # bundle it built, even when the release already carries that name --
      # uploads nothing and the step succeeds. A draft means either a first
      # run, or one queued behind a complete run whose upload failed: both
      # need the assets they lack.
      - name: Upload the assets the release lacks
        id: upload
        env:
          IS_DRAFT: ${{ steps.draft.outputs.is-draft }}
        run: |
          set -euo pipefail
          . scripts/release_report.sh
          if [ "${IS_DRAFT}" != true ]; then
            release_log "The release is already published; nothing to upload."
            release_record upload-assets skipped none 0
            exit 0
          fi
          shopt -s nullglob
          staged=(github-upload/*)
          if [ "${#staged[@]}" -eq 0 ]; then
            release_log "The release holds every artefact this run built."
            release_record upload-assets skipped none 0
            exit 0
          fi
          release_run upload-assets gh release upload "${GITHUB_REF_NAME}" "${staged[@]}"
      # The digest check compares what PyPI holds *now*, not what it held
      # before this run's upload. One re-read is not enough: PyPI serves the
      # index through a CDN cache, so a 200 can still describe the state
      # before `publish-pypi` uploaded. Ask again, within a fixed budget, until
      # the index lists every name this run staged, so a cache that lags the
      # upload delays the release instead of failing it.
      - name: Re-fetch the PyPI index
        id: index-final
        env:
          EXPECTED_PUBLISH: dist/publish
        run: *fetch-index
      - name: Check both destinations hold the same bytes
        id: verify
        run: |
          set -euo pipefail
          . scripts/release_report.sh
          release_run verify-assets gh release view "${GITHUB_REF_NAME}" \
            --json assets > release-assets.json
          release_run verify python3 -m scripts.release_assets_cli verify \
            --publish dist/publish --index pypi-index.json \
            --assets release-assets.json --bundles dist/attestations
      - name: Publish the GitHub Release
        id: publish
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          . scripts/release_report.sh
          release_run publish gh release edit "${GITHUB_REF_NAME}" --draft=false \
            --prerelease="${IS_PRERELEASE}"
